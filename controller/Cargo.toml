[package]
name = "controllers"
version.workspace = true
edition.workspace = true

[dependencies]
models = { path = "../model" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "sqlite", "macros"] }
sha2 = "0.10"
chrono = "0.4"
uuid = "1"
